<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档查看 · YOUR_APP</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--txt:#e6edf3;--dim:#8b949e;--acc:#58a6ff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;min-height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,rgba(88,166,255,.07),transparent);position:sticky;top:0;z-index:10;backdrop-filter:blur(4px)}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#58a6ff,#3fb950);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0d1117;font-size:16px;text-decoration:none}
  /* ---- 移动端竖屏 ---- */
  @media (max-width:600px){
    .top{padding:10px 14px;gap:10px;flex-wrap:wrap}
    .logo{width:30px;height:30px;font-size:14px;border-radius:8px}
    h1{font-size:16px}
    .btns{gap:6px}
    .btn{padding:7px 12px;font-size:12px}
    .wrap{padding:18px 14px 60px}
    h1{font-size:18px}
    #bodyTxt{padding:16px;font-size:14px}
    #bodyMd{padding:16px}
    #pdfBox iframe{height:75vh}
  }
  .btns{margin-left:auto;display:flex;gap:8px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 16px;border-radius:9px;
    cursor:pointer;font-size:13px;text-decoration:none}
  .btn:hover{border-color:var(--acc)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#0d1117;font-weight:600}
  .wrap{max-width:900px;margin:0 auto;padding:28px 24px 80px}
  h1{font-size:20px;font-weight:700;margin-bottom:6px}
  .ext{font-size:11px;color:var(--acc);border:1px solid var(--line);padding:2px 8px;border-radius:999px;background:rgba(88,166,255,.08)}
  .meta{color:var(--dim);font-size:12px;margin:4px 0 22px}
  #bodyTxt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 28px;
    line-height:1.8;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  /* 极简 markdown 渲染样式 */
  #bodyMd h1{font-size:24px;margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}
  #bodyMd h2{font-size:20px;margin:18px 0 8px}
  #bodyMd h3{font-size:16px;margin:14px 0 6px}
  #bodyMd p{margin:10px 0}
  #bodyMd ul,#bodyMd ol{margin:10px 0 10px 26px}
  #bodyMd li{margin:4px 0}
  #bodyMd code{background:#0a0e14;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:13px;color:#7ee787}
  #bodyMd pre{background:#0a0e14;border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;margin:12px 0}
  #bodyMd pre code{background:transparent;border:none;padding:0;display:block}
  #bodyMd blockquote{border-left:3px solid var(--acc);padding-left:14px;color:var(--dim);margin:12px 0}
  #bodyMd a{color:var(--acc)}
  #bodyMd table{border-collapse:collapse;margin:12px 0}
  #bodyMd th,#bodyMd td{border:1px solid var(--line);padding:7px 12px;font-size:13px}
  #pdfBox{width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0e14}
  #pdfBox iframe{width:100%;height:80vh;border:0;display:block}
  .loading{color:var(--dim);text-align:center;padding:60px 0;font-size:14px}
  .err{color:#f85149;text-align:center;padding:60px 0;font-size:14px}
  #toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/index.html" title="回到主页">A</a>
  <div>
    <h1 id="title">文档查看</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="btns">
    <a class="btn primary" id="rawLink" style="display:none" target="_blank" rel="noopener">⬇ 下载原文件</a>
    <a class="btn" href="/index.html">🏠 主页</a>
    <a class="btn" href="/graph.html">← 图谱</a>
  </div>
</div>
<div class="wrap" id="wrap"></div>

<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const id=params.get('id');
const wrap=$('wrap');

if(!id){ wrap.innerHTML='<div class="err">缺少文档 id 参数</div>'; }
else{ load(); }

function load(){
  wrap.innerHTML='<div class="loading">加载中…</div>';
  fetch('/doc/'+id)
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{
      $('title').textContent=d.title||('文档 '+id);
      const ext=(d.ext||'').replace('.','').toUpperCase()||d.src_type||'文本';
      $('meta').innerHTML=`<span class="ext">${ext.toLowerCase()}</span>&nbsp; 文档#${d.id} · 来源: ${d.has_file?'本地文件':'知识库存入'+''}`;
      if(d.has_file){
        $('rawLink').style.display='inline-block';
        $('rawLink').href='/doc/'+id+'/raw';
      }
      render(d);
    })
    .catch(e=>{ wrap.innerHTML='<div class="err">加载失败: '+e.message+'</div>'; });
}

function render(d){
  const ext=d.ext||'';
  const text=d.text||'';
  if(ext==='.pdf' && d.has_file){
    wrap.innerHTML=`<div id="pdfBox"><iframe src="/doc/${id}/raw" title="pdf"></iframe></div>`;
  } else if(ext==='.md' || ext==='.markdown' || looksMarkdown(text)){
    // markdown → 极简渲染
    const div=document.createElement('div'); div.id='bodyMd';
    div.innerHTML = renderMd(text);
    wrap.innerHTML=''; wrap.appendChild(div);
  } else {
    const div=document.createElement('div'); div.id='bodyTxt';
    div.textContent = text||'(无正文)';
    wrap.innerHTML=''; wrap.appendChild(div);
  }
}
function looksMarkdown(t){ // 检测文本是否有 markdown 特征(标题/列表/链接等)
  return /^#{1,6}\s/m.test(t) || /^\s*[-*]\s/m.test(t) || /^>\s/m.test(t) || /`/.test(t) || /\]\(/.test(t) || /^\s*\|/.test(t);
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderMd(md){
  if(!md) return '<p><em>(无正文)</em></p>';
  // 代码块先行保护
  const blocks=[];
  md=md.replace(/```([\s\S]*?)```/g,(_,c)=>{ blocks.push(esc('\n'+c+'\n')); return '\u0000B'+(blocks.length-1)+'\u0000'; });
  md=esc(md);
  md=md.replace(/\u0000B(\d+)\u0000/g,(_,i)=>`<pre><code>${blocks[+i]}</code></pre>`);
  // 标题
  md=md.replace(/^### (.*)$/gm,'<h3>$1</h3>');
  md=md.replace(/^## (.*)$/gm,'<h2>$1</h2>');
  md=md.replace(/^# (.*)$/gm,'<h1>$1</h1>');
  // 粗体/斜体/行内代码/链接
  md=md.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  md=md.replace(/\*([^*]+)\*/g,'<i>$1</i>');
  md=md.replace(/`([^`]+)`/g,'<code>$1</code>');
  md=md.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 引用
  md=md.replace(/^&gt; ?(.*)$/gm,'<blockquote>$1</blockquote>');
  // 列表
  md=md.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,m=>{
    const items=md; // noop
    return m;
  });
  // 段落
  const lines=md.split('\n'); let out=[],inli=false,i;
  for(i=0;i<lines.length;i++){
    const l=lines[i];
    if(/^<li>/.test(l)){ if(!inli){out.push('<ul>');inli=true;} out.push(l); continue; }
    if(inli){ out.push('</ul>'); inli=false; }
    if(!l.trim()) { if(out[out.length-1]!=='') out.push(''); continue; }
    if(/^<h[123]>/.test(l)||/^<pre>/.test(l)||/^<blockquote>/.test(l)){ out.push(l); continue; }
    out.push('<p>'+l+'</p>');
  }
  if(inli) out.push('</ul>');
  return out.join('\n');
}
</script>
</body>
</html>
