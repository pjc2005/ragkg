<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR_APP · 用量仪表盘</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--txt:#e6edf3;
        --dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--pink:#f778ba}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
       min-height:100vh;background-image:radial-gradient(circle at 20% -10%, rgba(88,166,255,.08), transparent 45%)}
  .wrap{max-width:720px;margin:0 auto;padding:40px 24px 24px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#58a6ff,#3fb950);
        display:flex;align-items:center;justify-content:center;font-weight:800;color:#0d1117;font-size:17px}
  h1{font-size:20px;font-weight:700}
  .sub{color:var(--dim);font-size:12px;width:100%}
  .stat-total{display:flex;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:20px 22px;margin-bottom:22px}
  .stat-total .num{font-size:40px;font-weight:800;color:var(--acc)}
  .stat-total .lab{color:var(--dim);font-size:13px}
  .stat-total .by{color:var(--dim);font-size:11px;margin-left:auto;text-align:right}
  h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 12px}
  .bar-row{display:grid;grid-template-columns:110px 1fr 64px;gap:12px;align-items:center;
        padding:9px 4px}
  .bar-row .k{color:var(--dim);font-size:13px}
  .bar-track{background:var(--panel);border:1px solid var(--line);border-radius:99px;height:16px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#58a6ff,#3fb950);width:0;
        transition:width .5s ease}
  .bar-row .v{color:var(--txt);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
  .key-hint{color:var(--dim);font-size:11px;margin-top:16px;line-height:1.7}
  .key-hint code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ok)}
  .foot{color:var(--dim);font-size:11px;text-align:center;margin:32px 0 0;padding-top:18px;border-top:1px solid var(--line)}
  .refresh-btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;
        padding:7px 14px;font-size:12px;cursor:pointer}
  .refresh-btn:hover{border-color:var(--acc);color:var(--acc)}
  .tabs{display:flex;gap:8px;margin:6px 0 16px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:99px;
       padding:5px 14px;font-size:12px;cursor:pointer}
  .tab.on{color:var(--txt);border-color:var(--acc)}
  .error{color:var(--err);font-size:13px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .loading{color:var(--dim);font-size:13px;padding:20px 0}
  .red{color:var(--err)} .warn{color:var(--warn)}
  @media(max-width:560px){
    .wrap{padding:24px 14px 16px}
    .stat-total .num{font-size:32px}
    .bar-row{grid-template-columns:86px 1fr 52px;gap:8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">A</a>
    <div>
      <h1>用量仪表盘 <span style="font-size:12px;color:var(--dim)"><your-domain></span></h1>
      <div class="sub">Cloudflare Worker + KV 免费打点层 · 数据实时读自边缘统计</div>
    </div>
    <button class="refresh-btn" id="refresh" style="margin-left:auto">↻ 刷新</button>
  </header>

  <div id="total" class="stat-total">
    <div style="font-size:13px;color:var(--dim)">总调用</div>
    <div>
      <span class="num" id="totalNum">–</span>
      <span class="lab">次</span>
    </div>
    <div class="by" id="totalBy"></div>
  </div>

  <h2>各功能调用次数</h2>
  <div class="tabs" id="tabs">
    <span class="tab on" data-scope="">累计</span>
    <span class="tab" data-scope="today">今日</span>
  </div>
  <div id="bars"></div>

  <p class="key-hint">key 含义：<code>ask</code> RAG问答 ·
    <code>search</code> 检索 · <code>graph</code> 图谱浏览 · <code>node</code> 节点下钻 ·
    <code>doc</code> 文档查看 · <code>home</code> 首页访问</p>

  <div class="foot">YOUR_APP RAG · 打点前端 pj.js · 统计由 <your-worker> Worker 提供</div>
</div>

<script src="/pj.js"></script>
<script>
(function(){
  const ENDPOINT='/stats';  // 同源: 由 8123 FastAPI 反代到 worker, 避开跨源 CORS/UnderAttack
  const KEY_CN={'ask':'RAG问答','search':'检索','graph':'图谱浏览','node':'节点下钻','doc':'文档','home':'首页'};
  const ORDER=['home','ask','search','graph','node','doc'];
  let curScope='';
  window.pj && window.pj('home');

  async function load(){
    const box=document.getElementById('bars');
    box.innerHTML='<div class="loading">加载中…</div>';
    // 不重建 #total 内部(保持 #totalNum / #totalBy 子元素存在), 只置灰
    document.getElementById('totalNum').textContent='–';
    document.getElementById('totalBy').textContent='';
    try{
      const url=ENDPOINT+(curScope==='today'?('?date='+todayStr()):'');
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json();
      render(d);
    }catch(e){
      document.getElementById('total').innerHTML='<div style="font-size:13px;color:var(--dim)">加载失败</div><div style="color:var(--err);font-size:12px">'+escapeHtml(e.message)+'</div>';
      document.getElementById('bars').innerHTML='<div class="error">无法读取统计。若你在浏览器访问 <your-domain> 也被拦，请确认站点 Access/安全策略放行真实浏览器。</div>';
    }
  }
  function render(d){
    // 处理今日分布结构 {counts:{...}, total}
    let counts, total;
    if(d.counts){ counts=d.counts; total=d.total; }
    else { counts=d; total=d.total||0; Object.keys(KEY_CN).forEach(k=>{if(!(k in counts)){counts[k]=0;}}); }

    document.getElementById('totalNum').textContent=total;

    // key 计数
    const items=ORDER.filter(k=>counts[k]).map(k=>({k,v:counts[k]}));
    if(!items.length) items.push({k:'home',v:0});
    const max=Math.max(1, ...items.map(x=>x.v));
    items.sort((a,b)=>b.v-a.v);
    let html='';
    for(const it of items){
      const pct=Math.round(it.v/max*100);
      html+=`<div class="bar-row">
        <div class="k">${KEY_CN[it.k]||it.k}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="v">${it.v}</div></div>`;
    }
    document.getElementById('bars').innerHTML=html;

    const n=items.reduce((s,x)=>s+x.v,0);
    document.getElementById('totalBy').textContent=
      curScope==='today' ? `今日 ${n} 次 · ${todayStr()}` : `累计关键项 ${n} 次`;
    document.getElementById('total').style.display='flex';
  }
  function todayStr(){
    // 本地日期, 与 worker CST 记日一致(worker 也按 UTC+8)
    const d=new Date(Date.now()+8*3600*1000);
    return d.toISOString().slice(0,10);
  }
  document.getElementById('refresh').onclick=load;
  document.getElementById('tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(!t)return;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    curScope=t.dataset.scope;
    load();
  });
  function escapeHtml(s){return (s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  load();
})();
</script>
</body>
</html>
